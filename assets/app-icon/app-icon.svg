<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="176" y1="112" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b3442"/>
      <stop offset="0.52" stop-color="#1b222d"/>
      <stop offset="1" stop-color="#11161e"/>
    </linearGradient>
    <linearGradient id="prompt" x1="508" y1="312" x2="813" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#78e7f2"/>
      <stop offset="1" stop-color="#35bfd4"/>
    </linearGradient>
  </defs>

  <!-- Transparent corners leave room for platform masks and launch surfaces. -->
  <rect x="48" y="48" width="928" height="928" rx="232" fill="#090c11"/>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#tile)"/>
  <rect x="84" y="84" width="856" height="856" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- The product mark: a structural F paired with a terminal prompt. Its
       bounding box, stroke caps included, is centred on the canvas and spans
       718 x 574, about 80% of the tile's width. A smaller mark left fesTerm
       reading as half the size of its neighbours in the Windows taskbar,
       because a quiet graphite tile contributes nothing against dark chrome:
       only the mark itself is visible, so only the mark's size is perceived. -->
  <path d="M198 754V270H441M198 487H391" fill="none" stroke="#f4f6f8" stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M531 335 711 500 531 665M691 744h140" fill="none" stroke="url(#prompt)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
