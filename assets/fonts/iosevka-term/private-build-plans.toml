[buildPlans.FesTermIosevka]
family = "fesTerm Iosevka Term"
spacing = "term"
exportGlyphNames = true

[buildPlans.FesTermIosevka.ligations]
inherits = "default-calt"
enables = [
  "arrow-l-hyphen",
  "arrow-r-hyphen",
  "arrow-lr-hyphen",
  "arrow-l-equal",
  "arrow-r-equal",
  "arrow-lr-equal",
  "eqeq",
  "lteq",
  "gteq",
  "exeq",
  "trig",
  "slash-asterisk",
  "kern-dotty",
  "kern-bars",
  "llgg",
  "llggeq",
]

[buildPlans.FesTermIosevka.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.FesTermIosevka.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.FesTermIosevka.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.FesTermIosevka.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.FesTermIosevka.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
