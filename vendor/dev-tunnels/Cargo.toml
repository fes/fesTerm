[package]
name = "tunnels"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "system-proxy", "json"] }
url = "2"
opentelemetry = { version = "0.20", features = ["trace"], optional = true }
serde_json = "1"
zeroize = "1"
async-trait = { version = "0.1", optional = true }
thiserror = "1.0"
log = "0.4"
tokio = { version = "1.20", features = ["macros", "io-util", "time"], optional = true }
tokio-util = { version = "0.7", optional = true }
tokio-tungstenite = { version = "0.29", optional = true, features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
uuid = { version = "1.4", features = ["v4"], optional = true }
rand = "0.8.5"
russh = { version = "0.62.5", default-features = false, features = ["ring"], optional = true }
hyper = { version = "1.9", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.8"
percent-encoding = "2.3"

[dev-dependencies]
tokio = { version = "1.20", features = ["full"] }
rand = "0.8"
regex = "1"

[features]
default = ["reqwest/rustls"]
end_to_end = []
instrumentation = ["dep:opentelemetry"]
connections = [
  "dep:async-trait",
  "dep:tokio",
  "dep:tokio-util",
  "dep:futures-util",
  "dep:hyper",
  "dep:http-body-util",
  "dep:hyper-util",
  "dep:tokio-tungstenite",
  "dep:uuid",
  "dep:russh",
]
