[package]
name = "festerm-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared iOS and Android mobile host for fesTerm."
publish = false

[features]
default = []
live-ssh = ["dep:festerm-session", "dep:festerm-mobile-tunnels", "dep:festerm-recording", "dep:festerm-recording-export", "dep:festerm-recording-apple", "dep:festerm-unix-security", "dep:tokio"]
host-clients = ["live-ssh", "dep:festerm-tunnel-bridge", "festerm-tunnel-bridge/host-routing", "dep:festerm-tunnel-client", "dep:festerm-host-protocol", "dep:tokio-util", "dep:serde_json"]
native-document-smoke = ["festerm-ios-window/native-document-smoke"]

[dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "wgpu"] }
festerm-core = { path = "../../crates/festerm-core" }
festerm-document = { path = "../../crates/festerm-document" }
festerm-host-setup = { path = "../../crates/festerm-host-setup" }
festerm-ios-lock = { path = "../../crates/festerm-ios-lock" }
festerm-ios-window = { path = "../../crates/festerm-ios-window" }
festerm-markdown = { path = "../../crates/festerm-markdown" }
festerm-mobile-docs = { path = "../../crates/festerm-mobile-docs" }
festerm-mobile-profiles = { path = "../../crates/festerm-mobile-profiles" }
festerm-recording = { path = "../../crates/festerm-recording", optional = true }
festerm-recording-export = { path = "../../crates/festerm-recording-export", optional = true }
festerm-secret-store = { path = "../../crates/festerm-secret-store" }
festerm-mobile-tunnels = { path = "../../crates/festerm-mobile-tunnels", optional = true }
festerm-tunnel-bridge = { path = "../../crates/festerm-tunnel-bridge", default-features = false, optional = true }
festerm-tunnel-client = { path = "../../crates/festerm-tunnel-client", optional = true }
festerm-host-protocol = { path = "../../crates/festerm-host-protocol", optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
serde_json = { version = "1", optional = true }
festerm-session = { path = "../../crates/festerm-session", optional = true }
festerm-sftp = { path = "../../crates/festerm-sftp" }
festerm-ssh = { path = "../../crates/festerm-ssh" }
festerm-ui-egui = { path = "../../crates/festerm-ui-egui" }
log = "0.4"
raw-window-handle = "0.6"
tokio = { version = "1.17.0", optional = true, default-features = false, features = ["rt", "sync", "time"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
zeroize = "1"

[dev-dependencies]
festerm-mobile-tunnels = { path = "../../crates/festerm-mobile-tunnels", features = ["testing"] }
festerm-unix-security = { path = "../../crates/festerm-unix-security" }
festerm-tunnel-bridge = { path = "../../crates/festerm-tunnel-bridge", default-features = false, features = ["client", "testing"] }
russh = { version = "0.62.5", default-features = false, features = ["ring"] }
tokio = { version = "1.17.0", default-features = false, features = ["net", "rt", "sync", "time", "io-util", "macros"] }
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

# Enables a desktop harness for the same host without adding desktop backends
# to an iOS package. The production desktop composition root is not imported.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(unix)'.dependencies]
festerm-unix-security = { path = "../../crates/festerm-unix-security", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
festerm-recording-apple = { path = "../../crates/festerm-recording-apple", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }
egui-winit = { version = "=0.36.1", default-features = false, features = ["external-ime"] }
festerm-android-platform = { path = "../../crates/festerm-android-platform" }

[lints]
workspace = true
