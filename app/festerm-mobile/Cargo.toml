[package]
name = "festerm-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Experimental iOS rendering and lifecycle host for fesTerm."
publish = false

[features]
default = []
live-ssh = ["dep:festerm-session", "dep:festerm-ssh", "dep:zeroize"]

[dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "wgpu"] }
festerm-core = { path = "../../crates/festerm-core" }
festerm-ios-window = { path = "../../crates/festerm-ios-window" }
festerm-markdown = { path = "../../crates/festerm-markdown" }
festerm-session = { path = "../../crates/festerm-session", optional = true }
festerm-ssh = { path = "../../crates/festerm-ssh", optional = true }
festerm-ui-egui = { path = "../../crates/festerm-ui-egui" }
log = "0.4"
raw-window-handle = "0.6"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
zeroize = { version = "1", optional = true }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
serde_json = "1"
sha2 = "0.11"

# Enables a desktop harness for the same host without adding desktop backends
# to an iOS package. The production desktop composition root is not imported.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["x11", "wayland"] }

[lints]
workspace = true
