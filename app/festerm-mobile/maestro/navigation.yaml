appId: ${APP_ID}
name: Navigate between top-level screens
---
- launchApp:
    stopApp: true
- assertVisible: "Profiles"
- tapOn: "Sessions"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Offline demo terminal"
- assertVisible: "Offline demo terminal"
- tapOn: "Profiles"
- assertVisible: "Open offline demo"
