[package]
name = "festerm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A scratch, multi-platform SSH/terminal client."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0"
festerm-core = { path = "../../crates/festerm-core" }
festerm-pty = { path = "../../crates/festerm-pty" }
festerm-session = { path = "../../crates/festerm-session" }
festerm-ui-egui = { path = "../../crates/festerm-ui-egui" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }

[lints]
workspace = true
