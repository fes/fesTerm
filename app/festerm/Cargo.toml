[package]
name = "festerm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A scratch, multi-platform SSH/terminal client."

[dependencies]
directories = "6"
eframe = "0"
festerm-config = { path = "../../crates/festerm-config" }
festerm-core = { path = "../../crates/festerm-core" }
festerm-macos-window = { path = "../../crates/festerm-macos-window" }
festerm-pty = { path = "../../crates/festerm-pty" }
festerm-session = { path = "../../crates/festerm-session" }
festerm-secret-store = { path = "../../crates/festerm-secret-store" }
festerm-ssh = { path = "../../crates/festerm-ssh" }
festerm-ui-egui = { path = "../../crates/festerm-ui-egui" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
russh = { version = "0.62.5", default-features = false, features = ["ring"] }

[lints]
workspace = true
