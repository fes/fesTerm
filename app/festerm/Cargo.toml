[package]
name = "festerm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A scratch, multi-platform SSH/terminal client."

[dependencies]
directories = "6"
eframe = "0"
festerm-config = { path = "../../crates/festerm-config" }
festerm-core = { path = "../../crates/festerm-core" }
festerm-linux-power = { path = "../../crates/festerm-linux-power" }
festerm-macos-window = { path = "../../crates/festerm-macos-window" }
festerm-pty = { path = "../../crates/festerm-pty" }
festerm-session = { path = "../../crates/festerm-session" }
festerm-sessiond = { path = "../../crates/festerm-sessiond" }
festerm-secret-store = { path = "../../crates/festerm-secret-store" }
festerm-serial = { path = "../../crates/festerm-serial" }
festerm-ssh = { path = "../../crates/festerm-ssh" }
festerm-ui-egui = { path = "../../crates/festerm-ui-egui" }
festerm-windows-power = { path = "../../crates/festerm-windows-power" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cargo-packager-updater = "0.2.3"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
accesskit = "0.24"
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
russh = { version = "0.62.5", default-features = false, features = ["ring"] }

[lints]
workspace = true
