[package]
name = "festerm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Headless host lifecycle configuration and diagnostics (ADR 0084)."
publish = false

[dependencies]
festerm-host-setup = { path = "../../crates/festerm-host-setup", features = ["acquisition", "native-services", "cloud"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
festerm-sessiond = { path = "../../crates/festerm-sessiond", features = ["test-support"] }

[lints]
workspace = true
