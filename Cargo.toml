[workspace]
members = [
    "app/festerm",
    "app/festerm-mobile",
    "crates/festerm-core",
    "crates/festerm-ios-window",
    "crates/festerm-config",
    "crates/festerm-linux-power",
    "crates/festerm-macos-window",
    "crates/festerm-pty",
    "crates/festerm-pty-test-child",
    "crates/festerm-serial",
    "crates/festerm-session",
    "crates/festerm-sessiond",
    "crates/festerm-secret-store",
    "crates/festerm-ssh",
    "crates/festerm-test-support",
    "crates/festerm-ui-egui",
    "crates/festerm-unix-security",
    "crates/festerm-windows-job",
    "crates/festerm-windows-power",
    "crates/festerm-windows-security",
    "crates/festerm-windows-runtime",
    "crates/festerm-windows-direct2d",
    "crates/festerm-markdown",
    "crates/festerm-document",
    "crates/festerm-syntax",
]
resolver = "2"
exclude = ["vendor/egui-winit", "vendor/egui-wgpu", "vendor/epaint", "vendor/russh-sftp", "fuzz"]

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
epaint = { path = "vendor/epaint" }
russh-sftp = { path = "vendor/russh-sftp" }

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
authors = ["fes"]
repository = "https://github.com/fes/fesTerm"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
