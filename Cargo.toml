[workspace]
members = [
    "app/festerm",
    "crates/festerm-core",
    "crates/festerm-test-support",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["fes"]
repository = "https://github.com/fes/fesTerm"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

