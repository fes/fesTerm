[workspace]
members = [
    "crates/festerm-admission",
    "crates/festerm-automation",
    "crates/festerm-automation-js",
    "crates/festerm-automation-mcp",
    "crates/festerm-automation-mcp-client",
    "crates/festerm-automation-workflow",
    "app/festerm",
    "app/festerm-host",
    "app/festerm-android",
    "app/festerm-mobile",
    "crates/festerm-android-platform",
    "crates/festerm-core",
    "crates/festerm-ios-lock",
    "crates/festerm-ios-window",
    "crates/festerm-config",
    "crates/festerm-enterprise",
    "crates/festerm-powershell",
    "crates/festerm-linux-power",
    "crates/festerm-macos-window",
    "crates/festerm-mobile-docs",
    "crates/festerm-mobile-profiles",
    "crates/festerm-mobile-tunnels",
    "crates/festerm-pty",
    "crates/festerm-pty-test-child",
    "crates/festerm-recording",
    "crates/festerm-recording-apple",
    "crates/festerm-recording-export",
    "crates/festerm-recording-linux",
    "crates/festerm-recording-windows",
    "crates/festerm-serial",
    "crates/festerm-session",
    "crates/festerm-sessiond",
    "crates/festerm-tunnel-bridge",
    "crates/festerm-tunnel-client",
    "crates/festerm-secret-store",
    "crates/festerm-sftp",
    "crates/festerm-ssh",
    "crates/festerm-test-support",
    "crates/festerm-ui-egui",
    "crates/festerm-unix-security",
    "crates/festerm-windows-job",
    "crates/festerm-windows-power",
    "crates/festerm-windows-security",
    "crates/festerm-windows-runtime",
    "crates/festerm-windows-direct2d",
    "crates/festerm-markdown",
    "crates/festerm-document",
    "crates/festerm-host-setup",
    "crates/festerm-host-protocol",
    "crates/festerm-syntax",
]
resolver = "2"
exclude = ["vendor/dev-tunnels", "vendor/egui", "vendor/egui-winit", "vendor/egui-wgpu", "vendor/epaint", "vendor/psrp-rs", "vendor/russh", "vendor/russh-sftp", "vendor/winrm-rs", "fuzz"]

[patch.crates-io]
accesskit_android = { path = "vendor/accesskit_android" }
egui = { path = "vendor/egui" }
egui-winit = { path = "vendor/egui-winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
epaint = { path = "vendor/epaint" }
russh = { path = "vendor/russh" }
russh-sftp = { path = "vendor/russh-sftp" }

[workspace.package]
version = "0.16.0"
edition = "2021"
license = "MIT"
authors = ["fes"]
repository = "https://github.com/fes/fesTerm"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
