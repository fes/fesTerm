[package]
name = "festerm-mobile-tunnels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-agnostic Dev Tunnels client backend (sign-in, discovery, attach) for the fesTerm iOS app."
publish = false

[features]
# Offline fakes for the network seams (`festerm_mobile_tunnels::testing`).
testing = ["dep:serde_json"]

[dependencies]
festerm-core = { path = "../festerm-core" }
festerm-mobile-profiles = { path = "../festerm-mobile-profiles" }
festerm-secret-store = { path = "../festerm-secret-store" }
festerm-session = { path = "../festerm-session" }
festerm-tunnel-bridge = { path = "../festerm-tunnel-bridge", default-features = false, features = ["client"] }
festerm-tunnel-client = { path = "../festerm-tunnel-client" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tunnels = { path = "../../vendor/dev-tunnels" }
zeroize = "1"
serde_json = { version = "1", optional = true }

[dev-dependencies]
festerm-mobile-tunnels = { path = ".", features = ["testing"] }
serde_json = "1"

[lints]
workspace = true
