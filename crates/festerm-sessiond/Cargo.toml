[package]
name = "festerm-sessiond"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Minimal local persistence daemon for fesTerm sessions."

[dependencies]
festerm-pty = { path = "../festerm-pty" }
festerm-session = { path = "../festerm-session" }
festerm-ssh = { path = "../festerm-ssh" }
# Not Windows-gated: the crate's `layout` module describes where the ConPTY
# sidecar belongs, and the helper's staging tests run on every platform.
festerm-windows-runtime = { path = "../festerm-windows-runtime" }
fs2 = "0.4.3"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
festerm-windows-job = { path = "../festerm-windows-job" }
festerm-windows-security = { path = "../festerm-windows-security" }
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[lints]
workspace = true
