[package]
name = "festerm-sessiond"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Minimal local persistence daemon for fesTerm sessions."

[dependencies]
festerm-pty = { path = "../festerm-pty" }
festerm-ssh = { path = "../festerm-ssh" }
fs2 = "0.4.3"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
named_pipe = "0.4.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
