[package]
name = "festerm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GUI-independent terminal state and protocol primitives for fesTerm."

[lints]
workspace = true

[dependencies]
# Pinned Unicode width and grapheme property data; see standards notes.
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
# Cell text is almost always 1-4 bytes (a single grapheme cluster);
# `CompactString` inlines up to 24 bytes on the stack instead of allocating
# on the heap for every printed character, which matters enormously under
# sustained high-volume output (e.g. `dir /s`) where every cell write and
# every scrolled-up row clones its text.
compact_str = "0.9"
url = "2.5"

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
# Dev-only, path-only, and deliberately cyclic: `festerm-test-support` depends
# on this crate's library, and this crate's *tests* depend on it back. Cargo
# permits cycles through dev-dependencies, and it keeps one copy of the
# capture-corpus slicing that the renderer snapshots also replay.
festerm-test-support = { path = "../festerm-test-support" }
# Only the `esctest-host` example needs this: the esctest2 conformance suite
# drives the terminal it is *running inside*, so hosting it means owning a pty.
portable-pty = "0.9.0"
proptest = "1.11.0"

[[bench]]
name = "sustained_output"
harness = false

[[bench]]
name = "interaction"
harness = false
