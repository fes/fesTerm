[package]
name = "festerm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GUI-independent terminal state and protocol primitives for fesTerm."

[lints]
workspace = true

[dependencies]
# Pinned Unicode width and grapheme property data; see standards notes.
icu_properties = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
unicode-width = "=0.2.2"

[dev-dependencies]
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "sustained_output"
harness = false

[[bench]]
name = "interaction"
harness = false
