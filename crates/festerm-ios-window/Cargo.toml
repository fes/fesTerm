[package]
name = "festerm-ios-window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Narrow UIKit keyboard geometry adapter for the iOS host."
publish = false

[features]
native-document-smoke = []

[dependencies]
# Matches egui 0.36's AccessKit tree types (ADR 0075).
accesskit = "0.24.1"
raw-window-handle = "0.6"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
festerm-android-platform = { path = "../festerm-android-platform" }
sha2 = "0.11"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"

[target.'cfg(target_os = "ios")'.dependencies]
accesskit_ios = "=0.1.1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSThread", "NSTimer", "NSRunLoop", "NSArray", "NSNotification", "NSOperation", "NSString", "NSURL", "NSDictionary", "NSObject", "NSObjCRuntime", "NSRange", "NSData", "NSError", "NSFileCoordinator", "NSFilePresenter", "NSUndoManager", "block2"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-uniform-type-identifiers", "UIView", "UIViewController", "UIResponder", "UIDevice", "UITextInput", "UITextInputTraits", "NSText", "UIGeometry", "UIKeyboardLayoutGuide", "UILayoutGuide", "UITrackingLayoutGuide", "UIWindow", "UIScene", "UISceneSession", "UISceneOptions", "UIWindowScene", "UIPasteboard", "UIApplication", "UIDocument", "UIDocumentPickerViewController", "block2"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
sha2 = "0.11"
block2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-speech = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionTask", "SFSpeechRecognitionResult", "SFTranscription"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioFormat", "AVAudioBuffer", "AVAudioSession", "AVAudioSessionTypes", "AVAudioTypes", "AVAudioTime"] }

# Like festerm-macos-window, this is the isolated native FFI boundary.
# Shared core/renderer and app crates continue to forbid unsafe code.
[lints.clippy]
all = "warn"
