[package]
name = "festerm-mobile-profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "UI-agnostic persistent profiles, host-key trust and SSH key management for the fesTerm iOS app."
publish = false

[dependencies]
festerm-secret-store = { path = "../festerm-secret-store" }
festerm-ssh = { path = "../festerm-ssh" }
russh = { version = "0.62.5", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[lints]
workspace = true
