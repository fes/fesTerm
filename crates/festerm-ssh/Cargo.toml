[package]
name = "festerm-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native SSH session transport and trust policy for fesTerm."

[dependencies]
festerm-session = { path = "../festerm-session" }
festerm-secret-store = { path = "../festerm-secret-store" }
russh = { version = "0.62.5", default-features = false, features = ["ring"] }
tokio = { version = "1.17.0", default-features = false, features = ["net", "rt", "sync", "time"] }
zeroize = "1"

