[package]
name = "festerm-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded tree-sitter syntax highlighting for fesTerm's editor and Markdown preview."

# The grammar set is closed and every grammar is recorded with its licence
# (ADR 0035 §3). Adding one is an ordinary, reviewable change to this list.
[dependencies]
tree-sitter = "0.27"                # MIT
tree-sitter-highlight = "0.27"      # MIT
tree-sitter-rust = "0.24"           # MIT
tree-sitter-c = "0.24"              # MIT
tree-sitter-cpp = "0.23"            # MIT
tree-sitter-python = "0.25"         # MIT
tree-sitter-toml-ng = "0.7"         # MIT
tree-sitter-json = "0.24"           # MIT
tree-sitter-yaml = "0.7"            # MIT
tree-sitter-bash = "0.25"           # MIT
tree-sitter-md = "0.5"              # MIT
tree-sitter-javascript = "0.25"     # MIT
tree-sitter-typescript = "0.23"     # MIT

[lints]
workspace = true
