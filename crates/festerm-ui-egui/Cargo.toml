[package]
name = "festerm-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui terminal presentation for the GUI-independent fesTerm core."

[dependencies]
compact_str = "0.9"
egui = "0"
festerm-core = { path = "../festerm-core" }
hashbrown = { version = "=0.17.1", default-features = false, features = ["raw-entry"] }
lru-slab = "0.1.2"
icu_properties = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
swash = "=0.2.10"
unicode-segmentation = "=1.13.3"
url = "2.5"

[dev-dependencies]
festerm-test-support = { path = "../festerm-test-support" }
egui_kittest = { version = "0", features = ["snapshot", "wgpu"] }
criterion = { version = "0.7", default-features = false }
stats_alloc = "0.1.10"
ttf-parser = "0.25"

[lints]
workspace = true

[[bench]]
name = "interaction_rendering"
harness = false

[[bench]]
name = "render_cache_allocations"
harness = false
