[package]
name = "festerm-pty-test-child"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Deterministic PTY test child for festerm-pty integration tests."
publish = false

[[bin]]
name = "festerm-pty-test-child"
path = "src/main.rs"

[dependencies]
terminal_size = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[lints]
workspace = true
