[package]
name = "festerm-pty"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Local PTY and Windows ConPTY session backend for fesTerm."

[dependencies]
festerm-session = { path = "../festerm-session" }
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
filedescriptor = "0.8.3"
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["resource"] }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
festerm-windows-job = { path = "../festerm-windows-job" }
festerm-windows-runtime = { path = "../festerm-windows-runtime" }

[lints]
workspace = true

[[bench]]
name = "blocked_output"
harness = false
