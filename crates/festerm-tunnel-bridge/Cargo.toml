[package]
name = "festerm-tunnel-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
relay = ["dep:tunnels", "dep:russh", "dep:tokio", "dep:tokio-util", "dep:reqwest", "dep:uuid", "dep:flume", "dep:rpassword", "dep:zeroize"]

[dependencies]
festerm-core = { path = "../festerm-core" }
festerm-session = { path = "../festerm-session" }
festerm-sessiond = { path = "../festerm-sessiond" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tunnels = { path = "../../vendor/dev-tunnels", optional = true, features = ["connections"] }
russh = { version = "0.62.5", default-features = false, features = ["ring"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros", "signal"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
flume = { version = "0.12", optional = true }
rpassword = { version = "7", optional = true }
zeroize = { version = "1", optional = true }

[[bin]]
name = "festerm-tunnel-bridge"
path = "src/main.rs"
required-features = ["relay"]

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
festerm-windows-security = { path = "../festerm-windows-security" }

[target.'cfg(unix)'.dependencies]
festerm-unix-security = { path = "../festerm-unix-security" }
