[package]
name = "festerm-tunnel-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["relay"]
# `client` is the portable (iOS-capable) attach path: relay connect, bridge
# discovery and the host-independent session client. `relay` adds the host side
# and the desktop persistent-session adapter (ADR 0057).
client = ["dep:tunnels", "dep:russh", "dep:tokio", "dep:tokio-util", "dep:reqwest", "dep:flume", "dep:zeroize"]
relay = ["client", "dep:festerm-sessiond", "dep:fs2", "dep:uuid", "dep:rpassword", "dep:festerm-unix-security", "dep:festerm-windows-security"]

[dependencies]
festerm-core = { path = "../festerm-core" }
festerm-session = { path = "../festerm-session" }
festerm-sessiond = { path = "../festerm-sessiond", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = { version = "0.4", optional = true }
tunnels = { path = "../../vendor/dev-tunnels", optional = true, features = ["connections"] }
russh = { version = "0.62.5", default-features = false, features = ["ring"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros", "signal", "process"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
flume = { version = "0.12", optional = true }
rpassword = { version = "7", optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "ring", "std", "tls12"] }

[[bin]]
name = "festerm-tunnel-bridge"
path = "src/main.rs"
required-features = ["relay"]

[[bin]]
name = "festerm-tunnel-setup"
path = "src/setup.rs"
required-features = ["relay"]

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
festerm-windows-security = { path = "../festerm-windows-security", optional = true }

[target.'cfg(unix)'.dependencies]
festerm-unix-security = { path = "../festerm-unix-security", optional = true }
