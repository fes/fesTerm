[package]
name = "festerm-windows-direct2d"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Opt-in Direct2D composition for Windows DX12 software adapters."

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
egui = "0.36"
wgpu = "30"
windows-core = "0.62"

[build-dependencies]
cc = "1"

[dev-dependencies]
egui-wgpu = "0.36"
egui_kittest = { version = "0.36", features = ["wgpu"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
