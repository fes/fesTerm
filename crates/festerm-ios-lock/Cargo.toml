[package]
name = "festerm-ios-lock"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Face ID / passcode app lock policy, persistence and privacy shield for the iOS host."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSThread", "NSNotification", "NSOperation", "NSString", "NSError", "NSTimer", "NSDictionary", "NSObject", "NSRunLoop", "NSDate", "block2"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "UIApplication", "UIView", "UIResponder", "UIGeometry", "UIColor", "UIWindow", "UIScreen", "UIViewController", "UILabel", "NSText", "NSParagraphStyle"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError", "LABiometryType", "LABase"] }

[dev-dependencies]
tempfile = "3"

# Like festerm-ios-window, the native FFI boundary is isolated here. Only the
# monotonic clock and the UIKit/LocalAuthentication bridge use `unsafe`.
[lints.clippy]
all = "warn"
