[package]
name = "festerm-recording"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded, local terminal recording and replay primitives for fesTerm."

[lints]
workspace = true

[dependencies]
bincode = "1.3"
crc32fast = "1"
festerm-core = { path = "../festerm-core" }
sha2 = "0.10"
unicode-segmentation = "=1.13.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
festerm-unix-security = { path = "../festerm-unix-security" }

[target.'cfg(target_os = "windows")'.dependencies]
festerm-windows-security = { path = "../festerm-windows-security" }

[dev-dependencies]
tempfile = "3"
