[package]
name = "festerm-recording-export"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Offline synchronized terminal recording export for fesTerm."
publish = false

[dependencies]
festerm-recording = { path = "../festerm-recording" }
festerm-ui-egui = { path = "../festerm-ui-egui" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
festerm-recording-apple = { path = "../festerm-recording-apple" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
festerm-unix-security = { path = "../festerm-unix-security" }
nix = { version = "0.31", default-features = false, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
festerm-recording-linux = { path = "../festerm-recording-linux" }

[target.'cfg(target_os = "windows")'.dependencies]
festerm-recording-windows = { path = "../festerm-recording-windows" }

[target.'cfg(target_os = "android")'.dependencies]
festerm-android-platform = { path = "../festerm-android-platform" }

[dev-dependencies]
festerm-core = { path = "../festerm-core" }
tempfile = "3"

[lints]
workspace = true
