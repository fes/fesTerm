[package]
name = "festerm-powershell"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded native PowerShell/PSRP backend for fesTerm."

[dependencies]
festerm-secret-store = { path = "../festerm-secret-store" }
psrp-rs = { path = "../../vendor/psrp-rs" }
rpassword = "7"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"

[dev-dependencies]
static_assertions = "1"

[lints]
workspace = true
