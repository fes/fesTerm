[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
javascript-program-process = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'binary_id(festerm-automation-js::program_process_worker)'
test-group = 'javascript-program-process'

[profile.ci.junit]
path = "junit.xml"
