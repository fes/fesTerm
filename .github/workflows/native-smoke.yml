name: Native Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recording-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify private staging, publication, and retention
        run: cargo test --locked -p festerm-recording-export --test export -- --nocapture
      - name: Ensure video inspection tools exist
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or
              -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH = "$env:ChocolateyInstall\bin;$env:PATH"
          }
          ffmpeg -version
          ffprobe -version
      - name: Check Windows desktop
        run: cargo check --locked -p festerm --bin festerm
      - name: Test shared Windows privacy
        run: cargo test --locked -p festerm-windows-power --lib
      - name: Test desktop recording coordinator
        run: cargo test --locked -p festerm --bin festerm application::recording::tests
      - name: Test automatic enrollment and session failures
        run: |
          cargo test --locked -p festerm --bin festerm recording_auto_enrollment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p festerm --bin festerm disconnected_or_closed_session
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p festerm --bin festerm event_channel_closing_after_clean_exit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p festerm --bin festerm recovery_palette_mismatch
      - name: Test terminal replay fast paths
        run: cargo test --locked -p festerm-core ascii_run_fast_path_tests
      - name: Test recording visibility rendering
        run: |
          cargo test --locked -p festerm-ui-egui color_emoji_and_block_cursor_can_reveal_equal_color_text
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p festerm-ui-egui --test recording_visibility
      - name: Encode and inspect native Windows video
        run: cargo test --locked -p festerm-recording-windows -- --ignored --nocapture
      - name: Verify private synchronized capture
        run: cargo test --locked -p festerm-recording -- --nocapture
      - name: Encode synchronized Windows sessions
        run: cargo test --locked -p festerm-recording-export --test export windows_stages_readable_synchronized_mp4s -- --ignored --nocapture
