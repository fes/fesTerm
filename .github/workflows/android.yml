name: Android mobile host

on:
  pull_request:
    paths:
      - 'app/festerm-android/**'
      - 'app/festerm-mobile/**'
      - 'crates/**'
      - 'vendor/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/THIRD_PARTY_NOTICES.txt'
      - 'scripts/*android*'
      - 'scripts/tests/test_android*'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-play-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}
      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      - name: Check Android packaging policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_android*.py'
      - name: Build shared live SSH application
        run: |
          python3 scripts/build-android.py --abi "${{ matrix.abi }}"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("target/android/${{ matrix.abi }}/live/fesTerm.apk") as apk:
              if apk.read("assets/THIRD_PARTY_NOTICES.txt") != Path("packaging/THIRD_PARTY_NOTICES.txt").read_bytes():
                  raise SystemExit("Android APK is missing the reviewed third-party notices")
          PY
      - name: Check offline dependency boundary
        run: python3 scripts/build-android.py --abi "${{ matrix.abi }}" --offline --check-dependencies
      - name: Retain development APK and provenance
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: festerm-android-${{ matrix.abi }}-development
          path: |
            target/android/${{ matrix.abi }}/live/fesTerm.apk
            target/android/${{ matrix.abi }}/live/build-receipt.json
          if-no-files-found: error

  play-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-play-bundle
      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      - name: Build and verify an unsigned bundle
        run: >-
          python3 scripts/build-android-play.py --validation-only --version-code 1001
          --output-dir "$RUNNER_TEMP/android-validation"
      - name: Sign with a disposable test key
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: android-test-only
          ANDROID_UPLOAD_KEY_ALIAS: test-upload
        run: |
          set -euo pipefail
          export ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/android-validation.p12"
          keytool -genkeypair -keystore "$ANDROID_UPLOAD_KEYSTORE" -storetype PKCS12 \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 365 \
            -dname 'CN=fesTerm CI Validation Only' \
            -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD
          bundle="$RUNNER_TEMP/android-validation/fesTerm-unsigned.aab"
          python3 scripts/sign-android-bundle.py "$bundle" \
            --output "$RUNNER_TEMP/android-validation/fesTerm.aab" \
            --sha256 "$(sha256sum "$bundle" | cut -d' ' -f1)"
      - name: Verify the generated universal APK
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: android-test-only
          ANDROID_UPLOAD_KEY_ALIAS: test-upload
        run: |
          set -euo pipefail
          bundletool_version=$(python3 -c 'import json; print(json.load(open("app/festerm-android/dependencies.json"))["bundletool"]["version"])')
          java -jar "target/android-tools/bundletool-all-${bundletool_version}.jar" build-apks \
            --bundle="$RUNNER_TEMP/android-validation/fesTerm.aab" \
            --output="$RUNNER_TEMP/validation.apks" --mode=universal \
            --aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            --ks="$RUNNER_TEMP/android-validation.p12" --ks-key-alias="$ANDROID_UPLOAD_KEY_ALIAS" \
            --ks-pass=pass:android-test-only --key-pass=pass:android-test-only
          unzip -p "$RUNNER_TEMP/validation.apks" universal.apk > "$RUNNER_TEMP/universal.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RUNNER_TEMP/universal.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/universal.apk"
          python3 - "$RUNNER_TEMP/universal.apk" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile(sys.argv[1]) as apk:
              if apk.read("assets/THIRD_PARTY_NOTICES.txt") != Path("packaging/THIRD_PARTY_NOTICES.txt").read_bytes():
                  raise SystemExit("Generated APK is missing the reviewed third-party notices")
              for abi in ("arm64-v8a", "x86_64"):
                  if f"lib/{abi}/libfesterm_android.so" not in apk.namelist():
                      raise SystemExit(f"Generated APK is missing its {abi} native library")
          PY
