name: Android mobile host

on:
  pull_request:
    paths:
      - 'app/festerm-android/**'
      - 'app/festerm-mobile/**'
      - 'crates/**'
      - 'vendor/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/*android*'
      - 'scripts/tests/test_android*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}
      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
      - name: Check Android packaging policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_android*.py'
      - name: Build shared live SSH application
        run: python3 scripts/build-android.py --abi "${{ matrix.abi }}"
      - name: Check offline dependency boundary
        run: python3 scripts/build-android.py --abi "${{ matrix.abi }}" --offline --check-dependencies
      - name: Retain development APK and provenance
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: festerm-android-${{ matrix.abi }}-development
          path: |
            target/android/${{ matrix.abi }}/live/fesTerm.apk
            target/android/${{ matrix.abi }}/live/build-receipt.json
          if-no-files-found: error
