name: Android mobile host

on:
  pull_request:
    paths:
      - 'app/festerm-android/**'
      - 'app/festerm-mobile/**'
      - 'crates/**'
      - 'vendor/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/*android*'
      - 'scripts/tests/test_android*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}
      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018
      - name: Check Android packaging policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_android*.py'
      - name: Build shared live SSH application
        run: python3 scripts/build-android.py --abi "${{ matrix.abi }}"
      - name: Check offline dependency boundary
        run: python3 scripts/build-android.py --abi "${{ matrix.abi }}" --offline --check-dependencies
      - name: Retain development APK and provenance
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: festerm-android-${{ matrix.abi }}-development
          path: |
            target/android/${{ matrix.abi }}/live/fesTerm.apk
            target/android/${{ matrix.abi }}/live/build-receipt.json
          if-no-files-found: error

  bundle:
    # Proves the Play AAB path on pull requests without the protected upload
    # key: an ephemeral key signs it and the artifact is not retained.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-bundle
      - name: Select Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018
      - name: Build an unsigned multi-ABI Play bundle
        run: python3 scripts/build-android.py --sdk "$ANDROID_HOME" --release --bundle --version-code 1
      - name: Sign with an ephemeral upload key
        run: |
          set -euo pipefail
          umask 077
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          export ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/ephemeral-upload.p12"
          export ANDROID_UPLOAD_KEYSTORE_PASSWORD="$password" ANDROID_UPLOAD_KEY_ALIAS=ephemeral-upload
          keytool -genkeypair -keystore "$ANDROID_UPLOAD_KEYSTORE" -storetype PKCS12 \
            -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD -keypass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            -alias ephemeral-upload -keyalg RSA -keysize 2048 -validity 2 -dname "CN=fesTerm ephemeral CI upload key"
          bundle=target/android/bundle/fesTerm-unsigned.aab
          python3 scripts/sign-android-bundle.py "$bundle" --output "$RUNNER_TEMP/fesTerm.aab" \
            --sha256 "$(sha256sum "$bundle" | cut -d' ' -f1)"
