name: OpenSSH Interoperability

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openssh-interop:
    name: OpenSSH Docker interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Docker
        run: docker info

      - name: Run all ignored OpenSSH interoperability tests
        run: scripts/run-openssh-interop.sh
