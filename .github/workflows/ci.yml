name: CI

on:
  push:
    # Feature-branch pushes are already covered by the `pull_request` event
    # below (which also runs the stricter validation-traceability diff
    # check); without this filter, every push to an open PR's branch fired
    # this entire matrix twice for the same commit. Direct pushes to `main`
    # (e.g. merges) still need their own run.
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_native_pki:
        description: Read-only public v0.16.0 publisher PKI fixture only (requires separate owner authorization)
        type: boolean
        required: false
        default: false
      windows_sampler_diagnostics:
        description: Run bounded opt-in WARP sampler and mixed-renderer diagnostics
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  windows-native-pki:
    name: opt-in Windows public publisher PKI fixture
    if: github.event_name == 'workflow_dispatch' && inputs.windows_native_pki
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Refuse mixed native scope
        if: inputs.windows_sampler_diagnostics
        shell: pwsh
        run: throw 'Read-only PKI dispatch cannot request sampler or GUI work.'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check public fixture and workflow contracts without native work
        run: python -m unittest discover -s scripts/tests -p "test_windows_publisher_validation.py" -v
      - name: Read-only native publisher fixture (never execute downloaded binary)
        id: publisher
        shell: pwsh
        env:
          FESTERM_RUN_OPTIONAL_VALIDATION: "1"
          FESTERM_RUN_ADR84_PUBLISHER_NATIVE: "1"
        run: .\scripts\run-optional-validation.ps1 -WindowsPublisherOnly -ResultPath windows-pki-optional-result.txt
      - name: Preserve exact exits, source and log hashes even on failure
        if: always() && steps.publisher.outcome != 'skipped' && steps.publisher.outcome != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-public-pki-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .windows-pki-evidence/*.json
            .windows-pki-evidence/*.log
            windows-pki-optional-result.txt
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  windows-sampler-diagnostics:
    name: opt-in Windows sampler diagnostics
    if: github.event_name == 'workflow_dispatch' && inputs.windows_sampler_diagnostics && !inputs.windows_native_pki
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Calibrate native diagnostics without GPU work
        run: python -m unittest discover -s scripts/tests -p "test_windows_*.py" -v
      - name: Run each bounded topology and workload once
        id: sampler
        shell: pwsh
        env:
          FESTERM_RUN_OPTIONAL_VALIDATION: "1"
          FESTERM_RUN_WINDOWS_SAMPLER_DIAGNOSTICS: "1"
        run: .\scripts\run-windows-sampler-diagnostics.ps1 -OutputDirectory "$env:RUNNER_TEMP\windows-sampler-diagnostics"
      - name: Retain content-free sampler diagnostic receipts
        if: always() && steps.sampler.outcome != 'skipped'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-sampler-native-metadata
          path: ${{ runner.temp }}/windows-sampler-diagnostics/*/*/*.json
          retention-days: 7
          if-no-files-found: error

  # Platform-independent checks: run once instead of duplicating across the
  # OS matrix below (formatting and these scripts do not vary by OS).
  checks:
    name: platform-independent checks
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_native_pki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: rustfmt --check --edition 2024 vendor/egui/src/input_state/mod.rs vendor/egui/src/text_selection/text_cursor_state.rs vendor/egui/src/text_selection/label_text_selection.rs vendor/egui/src/util/undoer.rs vendor/egui/src/widgets/text_edit/builder.rs vendor/egui/src/widgets/text_edit/state.rs
      - run: rustfmt --check --edition 2024 vendor/egui-winit/src/clipboard.rs
      - run: cargo fmt --manifest-path vendor/egui-wgpu/Cargo.toml -- --check
      - run: cargo fmt --manifest-path vendor/epaint/Cargo.toml -- --check
      - run: rustfmt --check --edition 2021 vendor/russh-sftp/src/client/session.rs
      - run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - run: python -m pip install -r validation/direct2d/requirements.txt
      - run: python -m unittest discover -s validation/direct2d -p "test_*.py"
      - run: python -m unittest discover -s validation/terminal-performance -p "test_*.py"
      - run: python scripts/manage_bundled_font.py
      - run: python scripts/check_unicode_emoji_data.py
      - run: python scripts/validate-icons.py --check
      - run: python scripts/generate_windows_icon.py --check
      - run: python scripts/check_packaging.py
      - run: python scripts/build_app_notices.py --check
      - run: python scripts/check_validation_traceability.py
      - name: Check warmed terminal scroll allocations
        run: cargo bench --locked -p festerm-core --bench scroll_allocations -- --check
      - run: python scripts/build_ui_state_doc.py --check
      - if: github.event_name == 'pull_request'
        run: python scripts/check_validation_traceability.py --base ${{ github.event.pull_request.base.sha }}

  helper-signature-compatibility:
    name: pinned helper signer compatibility
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_native_pki
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Install the release's exact cargo-packager signer
        run: cargo install cargo-packager --version 0.11.8 --locked --root "$PWD/.test-tools"
      - name: Verify genuine throwaway signatures through the private test seam
        run: |
          export PATH="$PWD/.test-tools/bin:$PATH"
          cargo test --locked -p festerm-host-setup --features artifacts --lib \
            artifacts::tests::pinned_cargo_packager_signatures_authenticate_python_produced_manifest \
            -- --exact --ignored

  # Third-party conformance. Our own escape-sequence tests only cover what we
  # thought to write down; esctest2 covers what xterm's maintainer thought to
  # write down, which is the point. Only the allowlist runs - see
  # `validation/esctest2-allow.txt` and #193 - so this job is a regression
  # gate, not a scoreboard.
  conformance:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_native_pki
    name: esctest2 conformance
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: conformance
      - run: scripts/run-esctest2.sh
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: esctest2-log
          path: target/esctest2.log
          if-no-files-found: ignore

  windows-security-privileged:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_native_pki
    name: Windows privileged security metadata
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-security-privileged
      - name: Require audit-metadata preservation and thread-scoped privileges
        run: cargo test --locked -p festerm-windows-security --lib -- --ignored --nocapture

  quality:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_native_pki
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Preserve this diagnostic slice's existing compile/link policy.
      # Native receipts use module offsets when local symbols are unavailable.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality
      - if: matrix.os == 'windows-latest'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require exact Windows timestamp alignment memory regression
        if: matrix.os == 'windows-latest'
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
        run: python scripts/run_windows_timestamp_alignment_test.py
      - name: Install a software Vulkan renderer for headless wgpu snapshot tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Install libudev headers for serial-port device enumeration
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libudev-dev pkg-config
      - name: Avoid optional Vulkan object naming in headless tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "WGPU_DEBUG=0" >> "$GITHUB_ENV"
          echo "WGPU_VALIDATION=1" >> "$GITHUB_ENV"
      - name: Select the software Vulkan driver for headless tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/select_headless_vulkan.py --github-env "$GITHUB_ENV"
      - name: Compile and list the Linux read-only logind proof without executing it
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          selector=controller::linux_login::tests::linux_login_native_read_only_logind_proof
          listing=$(cargo test --locked -p festerm-host-setup \
              --features host-runtime,native-services,cloud --lib "$selector" \
              -- --exact --ignored --list)
          printf '%s\n' "$listing"
          [ "$(printf '%s\n' "$listing" | grep -Fxc "$selector: test")" = 1 ]
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Validate authenticated helper artifacts without desktop dependencies
        shell: bash
        run: |
          cargo test --locked -p festerm-host-setup --features acquisition,native-services -p festerm-host
          cargo clippy --locked -p festerm-host-setup --features acquisition,native-services -p festerm-host --all-targets -- -D warnings
          python scripts/check_host_notices.py
          cargo test --locked -p festerm-host-setup -p festerm-tunnel-client --features festerm-host-setup/owner-enrollment,festerm-host-setup/cloud --lib
          cargo clippy --locked -p festerm-host-setup -p festerm-tunnel-client --features festerm-host-setup/owner-enrollment,festerm-host-setup/cloud --all-targets -- -D warnings
      - name: Test scoped desktop HOST consent and Settings workers
        shell: bash
        run: |
          # Six shared guards must not depend on workspace feature unification.
          cargo test --locked -p festerm-host-setup --features cloud,host-runtime,native-services --lib -- host_desktop_ protected_owner_desktop_scoped_
          # Seventeen model/adapter/headless-render tests, including Windows.
          cargo test --locked -p festerm --features local-host-settings --bin festerm desktop_remote_access
      - name: Check the experimental Dev Tunnels feature
        run: cargo clippy -p festerm -p festerm-tunnel-bridge -p festerm-host --all-targets --features festerm/experimental-dev-tunnels,festerm-tunnel-bridge/relay,festerm-tunnel-bridge/host-routing,festerm-host/owner-routing -- -D warnings
      - name: Test the experimental bridge protocol, relay and unexposed owner routing
        run: cargo test -p festerm-tunnel-bridge --features relay,host-routing
      - name: Test owned native HOST control, terminal and actual SSH lifecycle
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cargo build --locked -p festerm-sessiond -p festerm-pty-test-child --bins
          FESTERM_HOST_TEST_HELPER="$CARGO_TARGET_DIR/debug/festerm-sessiond" \
            cargo test --locked -p festerm-tunnel-bridge --features host-routing \
              native_ --lib -- --ignored --test-threads=1
      - name: Check portable enrolled-owner client without host dependencies
        run: cargo clippy --locked -p festerm-tunnel-bridge --no-default-features --features client,owner-auth --lib -- -D warnings
      - name: Test Dev Tunnel profiles and account isolation
        run: cargo test -p festerm --features experimental-dev-tunnels dev_tunnel
      - name: Test shared remote file routing
        run: cargo test -p festerm --features experimental-dev-tunnels remote_file
      - name: Check the excluded vendored text-selection library
        run: cargo test -p egui --lib
      - name: Check the excluded vendored clipboard integration
        run: cargo test -p egui-winit --lib clipboard::tests
      - name: Check the excluded vendored SSH authentication library
        run: cargo test --locked --manifest-path vendor/russh/Cargo.toml --lib
      - name: Check native Windows extended-attribute probing
        if: matrix.os == 'windows-latest'
        run: cargo test -p festerm-windows-security ordinary_temp_file_has_no_extended_attributes -- --nocapture
      - name: Check isolated Windows save integration
        if: matrix.os == 'windows-latest'
        run: cargo test -p festerm --bin festerm document_store::tests::saving_replaces_the_contents_and_returns_the_new_generation -- --exact --nocapture
      - name: Check Windows policies and calibrate native test diagnostics without GPU work
        if: matrix.os == 'windows-latest'
        run: python -m unittest discover -s scripts/tests -p "test_windows_*.py" -v
      - if: matrix.os != 'windows-latest'
        run: cargo test --workspace
      - name: Verify macOS standalone helper notices
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo metadata --locked --format-version 1 --filter-platform "$target" > "$RUNNER_TEMP/helper-metadata.json"
            python3 - "$RUNNER_TEMP/helper-metadata.json" "$target" <<'PY'
          import json, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import build_tunnel_bundle

          root = Path.cwd()
          version = tomllib.loads((root / "Cargo.toml").read_text())["workspace"]["package"]["version"]
          metadata = json.loads(Path(sys.argv[1]).read_text())
          build_tunnel_bundle.third_party_notices(metadata, version, root)
          print(f"Verified standalone helper notices for {sys.argv[2]}")
          PY
          done
      - name: Check native worker fault-injection probes
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p festerm-automation-js --lib platform::tests::native_probes_refuse_holes_in_process_escape_denials -- --exact --ignored \
            | tee "$RUNNER_TEMP/festerm-native-fault-probes.log"
          grep -F 'test platform::tests::native_probes_refuse_holes_in_process_escape_denials ... ok' "$RUNNER_TEMP/festerm-native-fault-probes.log"
      - name: Run Windows workspace tests with native exit metadata
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\run-windows-tests.ps1 -CargoArguments @('test', '--workspace')
        env:
          FESTERM_REQUIRE_WINDOWS_SYMLINKS: '1'
      - name: Test native PowerShell and enterprise CLI boundaries
        run: cargo test -p festerm-powershell -p festerm-enterprise --examples --locked
      - name: Qualify native SSH PSRP against the installed PowerShell runtime
        timeout-minutes: 5
        env:
          FESTERM_PSRP_SSH_PWSH_INTEROP: "1"
        run: cargo test -p festerm-powershell --test psrp_ssh_pwsh --locked -- --nocapture
      - name: Test the pinned PSRP dependency patches
        timeout-minutes: 15
        run: cargo test --manifest-path vendor/psrp-rs/Cargo.toml --tests --locked
      - name: Test the pinned WinRM dependency patches
        timeout-minutes: 15
        run: cargo test --manifest-path vendor/winrm-rs/Cargo.toml --tests --locked
      - name: Run the example JavaScript workflow through the contained worker
        shell: bash
        run: |
          cargo build -p festerm --bin festerm
          worker="$GITHUB_WORKSPACE/target/debug/festerm"
          if [ "$RUNNER_OS" = Linux ]; then
            cargo build -p festerm-automation-js --bin festerm-automation-js-worker
            worker="$GITHUB_WORKSPACE/target/debug/festerm-automation-js-worker"
          fi
          if [ "$RUNNER_OS" = Windows ]; then worker="$worker.exe"; fi
          FESTERM_TEST_JS_WORKER="$worker" cargo test -p festerm --bin festerm \
            automation::javascript::tests::example_workflow_reads_and_sends_only_approved_input_through_a_real_worker \
            -- --exact --ignored --nocapture
      - name: Check retained composition invariants in the vendored renderer
        if: matrix.os != 'windows-latest'
        run: cargo test -p egui-wgpu --lib retained::tests
      - name: Check Windows retained composition invariants with native exit metadata
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\run-windows-tests.ps1 -CargoArguments @('test', '-p', 'egui-wgpu', '--lib', 'retained::tests')
      - name: Check the excluded vendored font-atlas invariants
        if: matrix.os != 'windows-latest'
        run: cargo test --locked --manifest-path vendor/epaint/Cargo.toml --lib texture_atlas::tests
      - name: Check Windows excluded font-atlas invariants with native exit metadata
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\run-windows-tests.ps1 -CargoArguments @('test', '--locked', '--manifest-path', 'vendor\epaint\Cargo.toml', '--lib', 'texture_atlas::tests')
      - name: Check the shared Direct2D replay probe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m pip install -r validation\direct2d\requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Probe dependency installation failed.' }
          $env:FESTERM_RUN_OPTIONAL_VALIDATION = '1'
          .\validation\direct2d\run.ps1 -ResultDirectory "$env:RUNNER_TEMP\direct2d-probe" -SelfTestOnly
      - name: Check native comparison declarations without desktop access
        if: matrix.os == 'windows-latest'
        run: python -m unittest discover -s validation/terminal-performance -p "test_*.py" -v
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: snapshot-diff-${{ matrix.os }}
          path: |
            crates/festerm-ui-egui/tests/snapshots/*.diff.png
            crates/festerm-ui-egui/tests/snapshots/*.new.png
            target/direct2d-snapshots/*.png
          if-no-files-found: ignore
      - name: Retain content-free Windows test exit receipts
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-native-test-metadata
          path: target/windows-test-diagnostics/*.json
          retention-days: 7
          if-no-files-found: ignore
