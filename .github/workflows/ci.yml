name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace
      - run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - run: python scripts/check_validation_traceability.py
      - if: github.event_name == 'pull_request'
        run: python scripts/check_validation_traceability.py --base ${{ github.event.pull_request.base.sha }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diff-${{ matrix.os }}
          path: |
            crates/festerm-ui-egui/tests/snapshots/*.diff.png
            crates/festerm-ui-egui/tests/snapshots/*.new.png
          if-no-files-found: ignore
