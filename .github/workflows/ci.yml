name: PR373 WARP all-miss evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out diagnostic controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: controller
          persist-credentials: false
      - name: Check out frozen PR373 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 6e8fbff56de69717ed9c89d888178397b9a04caf
          path: source
          persist-credentials: false
      - name: Parse the diagnostic PowerShell controller
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE\controller\scripts\collect-pr373-warp-evidence.ps1",
            [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build once and retain all three independent controls
        shell: pwsh
        run: |
          & .\controller\scripts\collect-pr373-warp-evidence.ps1 `
            -SourceDirectory "$env:GITHUB_WORKSPACE\source" `
            -OutputDirectory "$env:RUNNER_TEMP\pr373-warp-evidence"
      - name: Retain numeric evidence even on failure
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pr373-warp-all-miss-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr373-warp-evidence
          if-no-files-found: error
          retention-days: 30
