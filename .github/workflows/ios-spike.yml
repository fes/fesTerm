name: iOS rendering spike

on:
  pull_request:
    paths:
      - 'app/festerm-mobile/**'
      - 'crates/festerm-core/**'
      - 'crates/festerm-ios-window/**'
      - 'crates/festerm-secret-store/**'
      - 'crates/festerm-session/**'
      - 'crates/festerm-ssh/**'
      - 'crates/festerm-markdown/**'
      - 'crates/festerm-syntax/**'
      - 'crates/festerm-ui-egui/**'
      - 'vendor/egui-winit/**'
      - 'vendor/egui-wgpu/**'
      - 'vendor/epaint/**'
      - 'vendor/russh/**'
      - 'vendor/russh-sftp/**'
      - 'assets/fonts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-ios-spike.py'
      - 'scripts/build-ios-device.py'
      - 'scripts/capture-mobile-ui.py'
      - 'scripts/smoke-ios-simulator.py'
      - 'scripts/tests/test_ios_simulator_smoke.py'
      - 'scripts/tests/test_ios_device_build.py'
      - 'scripts/tests/test_ios_ui_capture.py'
      - 'scripts/tests/test_ios_ssh_dependencies.py'
      - '.github/workflows/ios-spike.yml'
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    name: ${{ github.event_name == 'pull_request' && 'simulator-build' || 'experimental-simulator-smoke' }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-spike
      - name: Prepare the selected CoreSimulator service before compilation
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 4
        run: python3 scripts/smoke-ios-simulator.py --prepare-only
      - run: cargo test --locked -p festerm-mobile --lib
      - run: cargo test --locked -p festerm-mobile --features live-ssh --lib
      - run: cargo clippy --locked -p festerm-mobile --features live-ssh --all-targets -- -D warnings
      - name: Capture non-native mobile UI review images
        timeout-minutes: 10
        run: python3 scripts/capture-mobile-ui.py --output target/mobile-ui-review --emit-review-data
      - name: Upload non-native mobile UI review images
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: festerm-mobile-headless-ui-review
          path: target/mobile-ui-review/
          if-no-files-found: error
      - name: Check portable device packaging policy without credentials
        run: python3 -m unittest discover -s scripts/tests -p test_ios_device_build.py
      - run: python3 scripts/build-ios-spike.py --check-dependencies
      - run: python3 scripts/build-ios-spike.py --check-dependencies --live-ssh
      - name: Check portable iOS SSH dependency policy
        run: python3 -m unittest discover -s scripts/tests -p test_ios_ssh_dependencies.py
      - name: Compile the real SSH transport for iOS without desktop secret services
        run: cargo check --locked -p festerm-ssh --target aarch64-apple-ios
      - run: cargo check --locked -p festerm-mobile --target aarch64-apple-ios
      - run: cargo check --locked -p festerm-mobile --features live-ssh --target aarch64-apple-ios
      - name: Link the opt-in live SSH Simulator app
        run: python3 scripts/build-ios-spike.py --live-ssh
      - run: python3 scripts/build-ios-spike.py
      - name: Launch and relaunch on isolated iPhone and iPad Simulators
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 12
        run: python3 scripts/smoke-ios-simulator.py --run
      - name: Upload Simulator app bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: festerm-ios-simulator-spike
          path: target/ios-spike/fesTermSpike-simulator.tar.gz
          if-no-files-found: error
      - name: Upload opt-in live SSH Simulator app bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: festerm-ios-live-ssh-simulator
          path: target/ios-spike-live/fesTermSpike-simulator.tar.gz
          if-no-files-found: error
      - name: Upload Simulator smoke evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: festerm-ios-simulator-evidence
          path: target/ios-smoke/
          if-no-files-found: warn
