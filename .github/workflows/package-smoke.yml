name: Native package smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/package-smoke.yml'
      - '.github/workflows/release.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'app/festerm/**'
      - 'assets/app-icon/**'
      - 'packaging/**'
      - 'scripts/check_packaging.py'
      - 'scripts/stage-conpty.ps1'
      - 'third_party/conpty/**'

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
    env:
      FESTERM_UPDATE_PUBLIC_KEY: unsigned-package-smoke-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key from ci.yml's `quality` job: this workflow
          # builds `--release` artifacts, which produce different
          # fingerprints/objects than the dev/test builds cached there.
          key: package-smoke
      - name: Validate packaging metadata
        run: |
          python scripts/generate_windows_icon.py --check
          python scripts/check_packaging.py
      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - name: Cache pinned cargo-packager binary
        id: cargo-packager-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-packager.exe
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned cargo-packager
        if: steps.cargo-packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build unsigned macOS package
        if: matrix.platform == 'macos'
        env:
          FESTERM_INSTALLATION_KIND: app
        run: |
          cargo build --release -p festerm -p festerm-sessiond
          cargo packager --config packaging/macos.toml --formats app
          test -x target/release/fesTerm.app/Contents/MacOS/festerm
          test -x target/release/fesTerm.app/Contents/MacOS/festerm-sessiond
          test -f target/release/fesTerm.app/Contents/Info.plist
          test "$(defaults read "$PWD/target/release/fesTerm.app/Contents/Info" CFBundleIdentifier)" = "dev.fes.festerm"
          test "$(defaults read "$PWD/target/release/fesTerm.app/Contents/Info" CFBundleExecutable)" = "festerm"
      - name: Build unsigned Windows package with verified ConPTY sidecar
        if: matrix.platform == 'windows'
        env:
          FESTERM_INSTALLATION_KIND: nsis
        shell: pwsh
        run: |
          ./scripts/stage-conpty.ps1 -Configuration Release
          cargo packager --config packaging/windows.toml --formats nsis
          $installer = Get-ChildItem target/release -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'cargo-packager did not produce an NSIS installer'
          }
          $installDirectory = Join-Path $env:LOCALAPPDATA 'fesTerm'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS clean install failed with exit code $($process.ExitCode)"
          }
          $installedBinary = Join-Path $installDirectory 'festerm.exe'
          $installedSessionDaemon = Join-Path $installDirectory 'festerm-sessiond.exe'
          $installedConpty = Join-Path $installDirectory 'runtime/conpty/win-x64/conpty.dll'
          $uninstaller = Join-Path $installDirectory 'uninstall.exe'
          if (-not (Test-Path $installedBinary -PathType Leaf)) {
            throw 'NSIS install did not place festerm.exe'
          }
          if (-not (Test-Path $installedSessionDaemon -PathType Leaf)) {
            throw 'NSIS install did not place festerm-sessiond.exe'
          }
          if (-not (Test-Path $installedConpty -PathType Leaf)) {
            throw 'NSIS install did not place the ConPTY runtime'
          }
          if (-not (Test-Path $uninstaller -PathType Leaf)) {
            throw 'NSIS install did not place an uninstaller'
          }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS uninstall failed with exit code $($process.ExitCode)"
          }
          if (Test-Path $installedBinary) {
            throw 'NSIS uninstall left the application binary installed'
          }
          if (Test-Path $installedSessionDaemon) {
            throw 'NSIS uninstall left the session daemon installed'
          }
      - name: Build unsigned Linux AppImage
        if: matrix.platform == 'linux'
        env:
          FESTERM_INSTALLATION_KIND: appimage
        run: |
          cargo build --release -p festerm -p festerm-sessiond
          cargo packager --config packaging/linux.toml --formats appimage
          appimage="$(find target/release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          (
            cd target/release
            rm -rf squashfs-root
            "./$(basename "$appimage")" --appimage-extract >/dev/null
            test -x squashfs-root/AppRun
            test -x squashfs-root/usr/bin/festerm
            test -x squashfs-root/usr/bin/festerm-sessiond
            test -n "$(find squashfs-root/usr/share/applications -maxdepth 1 -name '*.desktop' -print -quit)"
            rm -rf squashfs-root
          )
      - name: Rebuild package-managed Linux binary and Debian package
        if: matrix.platform == 'linux'
        env:
          FESTERM_INSTALLATION_KIND: managed
        run: |
          cargo build --release -p festerm -p festerm-sessiond
          cargo packager --config packaging/linux.toml --formats deb
          deb="$(find target/release -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb" >/dev/null
          dpkg-deb --contents "$deb" | grep -q 'usr/bin/festerm$'
          dpkg-deb --contents "$deb" | grep -q 'usr/bin/festerm-sessiond$'
          sudo dpkg --install "$deb"
          test -x /usr/bin/festerm
          test -x /usr/bin/festerm-sessiond
          sudo dpkg --remove festerm
          test ! -e /usr/bin/festerm
          test ! -e /usr/bin/festerm-sessiond
