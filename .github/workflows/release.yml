name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to package
        required: true
        type: string
      resume_publish:
        description: Resume an unpublished tagged release using reviewed tooling on main
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      WGPU_DEBUG: "0"
      WGPU_VALIDATION: "1"
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      recovery: ${{ steps.release.outputs.recovery }}
      helper_sha256: ${{ steps.release.outputs.helper_sha256 }}
      authenticated_helpers: ${{ steps.release.outputs.authenticated_helpers }}
      headless_helpers: ${{ steps.release.outputs.headless_helpers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Resolve and validate release version
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RESUME_PUBLISH: ${{ inputs.resume_publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recovery=false
          source_commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            publish=true
          else
            version="$DISPATCH_VERSION"
            tag="v$version"
            publish=false
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          workspace_version=$(sed -nE '/^\[workspace\.package\]$/,/^\[/s/^version = "([^"]+)"$/\1/p' Cargo.toml)
          [[ "$version" == "$workspace_version" ]]
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$RESUME_PUBLISH" == true ]]; then
            source_commit=$(python3 scripts/recover-desktop-release.py \
              --version "$version" --head "$GITHUB_SHA" --ref "$GITHUB_REF" \
              --repo "$GITHUB_REPOSITORY")
            publish=true
            recovery=true
          elif [[ "$publish" == true ]]; then
            [[ "$(git rev-list -n 1 "$tag")" == "$GITHUB_SHA" ]]
          fi
          helper_sha256=$(sha256sum scripts/build_tunnel_bundle.py | cut -d ' ' -f1)
          authenticated_helpers=true
          headless_helpers=true
          if ! git show "$source_commit:scripts/build_host_manifest.py" 2>/dev/null | grep -q '^SCHEMA = 2$'; then
            if [[ "$recovery" != true ]]; then
              echo "::error::Release source lacks schema-2 headless helper tooling"
              exit 1
            fi
            headless_helpers=false
            echo "::notice::Legacy tag recovery: preserve the old helper payload without host CLI"
          fi
          if ! git cat-file -e "$source_commit:scripts/build_host_manifest.py" 2>/dev/null; then
            # Recovery must preserve the tagged source contract. Do not copy a
            # new verifier/manifest scheme into an older runtime's release.
            if [[ "$recovery" != true ]]; then
              echo "::error::Release source lacks authenticated helper tooling"
              exit 1
            fi
            authenticated_helpers=false
            echo "::notice::Legacy tag recovery: no authenticated-helper claim for this source"
          fi
          {
            echo "publish=$publish"
            echo "tag=$tag"
            echo "version=$version"
            echo "source_commit=$source_commit"
            echo "recovery=$recovery"
            echo "helper_sha256=$helper_sha256"
            echo "authenticated_helpers=$authenticated_helpers"
            echo "headless_helpers=$headless_helpers"
          } >> "$GITHUB_OUTPUT"
      - name: Install Linux validation dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y libudev-dev mesa-vulkan-drivers pkg-config
      - name: Select the software Vulkan driver for headless tests
        run: python3 scripts/select_headless_vulkan.py --github-env "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate authenticated helper artifacts
        run: |
          cargo test --locked -p festerm-host-setup --features artifacts
          cargo clippy --locked -p festerm-host-setup --features artifacts --all-targets -- -D warnings
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 scripts/manage_bundled_font.py
      - name: Stage release-specific optional font assets
        run: python3 scripts/manage_bundled_font.py --stage-downloads font-downloads --downloads-report font-downloads.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: optional-font-downloads
          path: font-downloads/*
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: optional-font-downloads-report
          path: font-downloads.json
          if-no-files-found: error
      - run: python3 scripts/generate_windows_icon.py --check
      - run: python3 scripts/check_packaging.py
      - run: python3 scripts/build_app_notices.py --check
      - run: python3 scripts/check_validation_traceability.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: steps.release.outputs.recovery == 'true'
        with:
          name: recovery-helper-packager
          path: scripts/build_tunnel_bundle.py
          if-no-files-found: error

  macos:
    name: Package macOS
    needs: validate
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    env:
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
      FESTERM_INSTALLATION_KIND: app
      FESTERM_UPDATE_PUBLIC_KEY: ${{ vars.FESTERM_UPDATE_PUBLIC_KEY }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Require protected signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD"
          test -n "$FESTERM_UPDATE_PUBLIC_KEY"
          test "$FESTERM_UPDATE_PUBLIC_KEY" = "$(cat packaging/updater.pub)"
      - name: Install pinned cargo-packager
        run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
      - name: Prepare signing configuration
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_P8"
          mkdir -p private_keys
          printf '%s' "$APPLE_API_KEY_P8" > "private_keys/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "private_keys/AuthKey_${APPLE_API_KEY}.p8"
          python3 scripts/prepare_macos_release_config.py \
            --input packaging/macos.toml \
            --output packaging/macos-release.toml \
            --signing-identity "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_API_KEY_PATH=$GITHUB_WORKSPACE/private_keys/AuthKey_${APPLE_API_KEY}.p8" \
            >> "$GITHUB_ENV"
      - name: Build, sign, and notarize
        shell: bash
        run: |
          set -euo pipefail
          # Apple's ticket service intermittently drops runner connections
          # after notarization succeeds; retry stapling. Validation below
          # still fails the job if no ticket was stapled.
          staple() {
            for delay in 0 30 60 120 240; do
              sleep "$delay"
              xcrun stapler staple "$1" && return 0
            done
            return 1
          }
          cargo build --release -p festerm -p festerm-sessiond
          cargo build --locked --release -p festerm-tunnel-bridge --no-default-features --features relay --bins
          if ! cargo packager --config packaging/macos-release.toml --formats app; then
            echo "::warning::cargo-packager failed; retrying the notarization staple"
            staple target/release/fesTerm.app
          fi
          codesign --verify --deep --strict --verbose=2 target/release/fesTerm.app
          app_team=$(codesign -dv --verbose=4 target/release/fesTerm.app/Contents/MacOS/festerm 2>&1 | sed -n 's/^TeamIdentifier=//p')
          test -n "$app_team"
          test "$app_team" != "not set"
          for helper in festerm-sessiond festerm-tunnel-setup festerm-tunnel-bridge; do
            binary="target/release/fesTerm.app/Contents/MacOS/$helper"
            test -x "$binary"
            codesign --verify --strict -R='anchor apple generic' --verbose=2 "$binary"
            helper_signature=$(codesign -dv --verbose=4 "$binary" 2>&1)
            test "$(printf '%s\n' "$helper_signature" | sed -n 's/^TeamIdentifier=//p')" = "$app_team"
            printf '%s\n' "$helper_signature" | grep -q 'flags=.*runtime'
          done
          xcrun stapler validate target/release/fesTerm.app
          spctl --assess --type execute --verbose=2 target/release/fesTerm.app
          mkdir dist
          COPYFILE_DISABLE=1 tar -C target/release -czf \
            "dist/fesTerm-${VERSION}-macos-aarch64.app.tar.gz" fesTerm.app
          cargo packager signer sign \
            "dist/fesTerm-${VERSION}-macos-aarch64.app.tar.gz"
          cargo packager --config packaging/macos-release.toml --formats dmg
          dmg=$(find target/release -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --output-format json > dmg-notarization.json
          python3 -c \
            'import json; assert json.load(open("dmg-notarization.json"))["status"] == "Accepted"'
          staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          hdiutil verify "$dmg"
          mv "$dmg" "dist/fesTerm-${VERSION}-macos-aarch64.dmg"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  windows-arm-build:
    name: Build Windows (aarch64)
    needs: validate
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    environment: release
    env:
      FESTERM_INSTALLATION_KIND: nsis
      FESTERM_UPDATE_PUBLIC_KEY: ${{ vars.FESTERM_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Add native LLVM to PATH
        shell: pwsh
        run: |
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'clang.exe') -PathType Leaf)) {
            throw "Native LLVM is unavailable at $llvmBin"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Require ARM64 build configuration
        shell: pwsh
        run: |
          $hostTriple = rustc -vV |
            Select-String '^host: ' |
            ForEach-Object { $_.Line.Substring(6) }
          if ($hostTriple -ne 'aarch64-pc-windows-msvc') {
            throw "Expected native Windows ARM64 Rust host, got $hostTriple"
          }
          if ([string]::IsNullOrWhiteSpace($env:FESTERM_UPDATE_PUBLIC_KEY)) {
            throw 'Missing protected release value: FESTERM_UPDATE_PUBLIC_KEY'
          }
          if ($env:FESTERM_UPDATE_PUBLIC_KEY -ne (Get-Content packaging/updater.pub -Raw).Trim()) {
            throw 'Protected updater public key does not match packaging/updater.pub'
          }
      - name: Build and stage verified ARM64 ConPTY runtime
        shell: pwsh
        run: |
          ./scripts/stage-conpty.ps1 -Configuration Release
          cargo build --locked --release -p festerm-tunnel-bridge --no-default-features --features relay --bins
          if ($LASTEXITCODE -ne 0) { throw 'Tunnel helper build failed' }
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-aarch64-package-input
          path: |
            target/release/festerm.exe
            target/release/festerm-sessiond.exe
            target/release/festerm-tunnel-setup.exe
            target/release/festerm-tunnel-bridge.exe
            target/release/festerm-tunnel-worker.exe
            target/release/runtime/conpty
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Sign and package Windows (${{ matrix.arch }})
    needs: [validate, windows-arm-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            pe_machine: '0x8664'
            conpty_runtime: win-x64
            conpty_host: x64
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            pe_machine: '0xAA64'
            conpty_runtime: win-arm64
            conpty_host: arm64
    runs-on: windows-2025
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
      FESTERM_INSTALLATION_KIND: nsis
      FESTERM_UPDATE_PUBLIC_KEY: ${{ vars.FESTERM_UPDATE_PUBLIC_KEY }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Require protected signing configuration
        shell: pwsh
        run: |
          foreach ($name in @(
            'AZURE_ARTIFACT_SIGNING_ACCOUNT',
            'AZURE_ARTIFACT_SIGNING_ENDPOINT',
            'AZURE_ARTIFACT_SIGNING_PROFILE',
            'AZURE_CLIENT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'AZURE_TENANT_ID',
            'CARGO_PACKAGER_SIGN_PRIVATE_KEY',
            'CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD',
            'FESTERM_UPDATE_PUBLIC_KEY'
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Missing protected release value: $name"
            }
          }
          if ($env:FESTERM_UPDATE_PUBLIC_KEY -ne (Get-Content packaging/updater.pub -Raw).Trim()) {
            throw 'Protected updater public key does not match packaging/updater.pub'
          }
        env:
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      - name: Install pinned cargo-packager
        run: cargo install cargo-packager --version $env:CARGO_PACKAGER_VERSION --locked
      - name: Build and stage verified x86_64 ConPTY runtime
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          ./scripts/stage-conpty.ps1 -Configuration Release
          cargo build --locked --release -p festerm-tunnel-bridge --no-default-features --features relay --bins
          if ($LASTEXITCODE -ne 0) { throw 'Tunnel helper build failed' }
      - name: Download native ARM64 package input
        if: matrix.arch == 'aarch64'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-aarch64-package-input
          path: target/release
      - name: Verify package input architecture and ConPTY signatures
        shell: pwsh
        run: |
          $expectedMachine = [Convert]::ToUInt16('${{ matrix.pe_machine }}'.Substring(2), 16)
          foreach ($binary in @(
            'target/release/festerm.exe',
            'target/release/festerm-sessiond.exe',
            'target/release/festerm-tunnel-setup.exe',
            'target/release/festerm-tunnel-bridge.exe',
            'target/release/festerm-tunnel-worker.exe'
          )) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $binary))
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne $expectedMachine) {
              throw "Unexpected PE architecture for ${binary}: 0x$($machine.ToString('X4'))"
            }
          }
          foreach ($sidecar in @(
            'target/release/runtime/conpty/${{ matrix.conpty_runtime }}/conpty.dll',
            'target/release/runtime/conpty/${{ matrix.conpty_runtime }}/${{ matrix.conpty_host }}/OpenConsole.exe'
          )) {
            if ((Get-AuthenticodeSignature $sidecar).Status -ne 'Valid') {
              throw "Pinned ConPTY sidecar is not Authenticode-valid: $sidecar"
            }
          }
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign application binary
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\festerm.exe
            ${{ github.workspace }}\target\release\festerm-sessiond.exe
            ${{ github.workspace }}\target\release\festerm-tunnel-setup.exe
            ${{ github.workspace }}\target\release\festerm-tunnel-bridge.exe
            ${{ github.workspace }}\target\release\festerm-tunnel-worker.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Stage immutable Windows session daemon
        shell: pwsh
        run: |
          $applicationSignature = Get-AuthenticodeSignature 'target/release/festerm.exe'
          if ($applicationSignature.Status -ne 'Valid') {
            throw 'Application is not Authenticode-valid'
          }
          foreach ($helper in @('festerm-sessiond', 'festerm-tunnel-setup', 'festerm-tunnel-bridge', 'festerm-tunnel-worker')) {
            $signature = Get-AuthenticodeSignature "target/release/$helper.exe"
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Subject -ne $applicationSignature.SignerCertificate.Subject) {
              throw "Helper does not have a valid matching publisher: $helper"
            }
          }
          $versionedHelper = ./scripts/stage-windows-sessiond.ps1 -Configuration Release
          if ((Get-AuthenticodeSignature $versionedHelper).Status -ne 'Valid') {
            throw "Staged session daemon is not Authenticode-valid: $versionedHelper"
          }
      - name: Build NSIS installer
        shell: pwsh
        run: |
          python scripts/run-cargo-packager.py --config packaging/windows.toml --formats nsis --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'cargo-packager failed to build the NSIS installer' }
          $installers = @(Get-ChildItem target/release -Filter 'festerm_*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item $installers[0].FullName "dist/fesTerm-$env:VERSION-windows-$env:PACKAGE_ARCH-setup.exe"
      - name: Sign NSIS installer
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\fesTerm-${{ needs.validate.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify and sign updater artifact
        shell: pwsh
        run: |
          $installer = "dist/fesTerm-$env:VERSION-windows-$env:PACKAGE_ARCH-setup.exe"
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') {
            throw 'NSIS installer does not have a valid Authenticode signature'
          }
          cargo packager signer sign $installer
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Package Linux (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release
    env:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
      FESTERM_UPDATE_PUBLIC_KEY: ${{ vars.FESTERM_UPDATE_PUBLIC_KEY }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Require protected signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD"
          test -n "$FESTERM_UPDATE_PUBLIC_KEY"
          test "$FESTERM_UPDATE_PUBLIC_KEY" = "$(cat packaging/updater.pub)"
      - name: Install packaging dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 libudev-dev pkg-config
          cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
      - name: Build AppImage updater artifact
        env:
          FESTERM_INSTALLATION_KIND: appimage
        run: |
          set -euo pipefail
          cargo build --release -p festerm -p festerm-sessiond -p festerm-automation-js
          cargo build --locked --release -p festerm-tunnel-bridge --no-default-features --features relay --bins
          python3 scripts/run-cargo-packager.py --config packaging/linux.toml --formats appimage
          appimage=$(find target/release -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          mkdir dist
          mv "$appimage" "dist/fesTerm-${VERSION}-linux-${PACKAGE_ARCH}.AppImage"
          chmod +x "dist/fesTerm-${VERSION}-linux-${PACKAGE_ARCH}.AppImage"
          cargo packager signer sign "dist/fesTerm-${VERSION}-linux-${PACKAGE_ARCH}.AppImage"
      - name: Build package-managed Debian artifact
        env:
          FESTERM_INSTALLATION_KIND: managed
        run: |
          set -euo pipefail
          cargo build --release -p festerm -p festerm-sessiond -p festerm-automation-js
          cargo build --locked --release -p festerm-tunnel-bridge --no-default-features --features relay --bins
          cargo packager --config packaging/linux.toml --formats deb
          deb=$(find target/release -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          mv "$deb" "dist/fesTerm-${VERSION}-linux-${PACKAGE_ARCH}.deb"
          dpkg-deb --info "dist/fesTerm-${VERSION}-linux-${PACKAGE_ARCH}.deb"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  helper-bundles:
    name: Build standalone helpers (${{ matrix.platform }}-${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: windows
            arch: aarch64
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      HELPER_PLATFORM: ${{ matrix.platform }}
      HELPER_ARCH: ${{ matrix.arch }}
      HEADLESS_HELPERS: ${{ needs.validate.outputs.headless_helpers }}
      RELEASE_RECOVERY: ${{ needs.validate.outputs.recovery }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: matrix.platform == 'macos' && needs.validate.outputs.recovery == 'true'
        with:
          name: recovery-helper-packager
          path: ${{ runner.temp }}/recovery-helper
      - name: Use verified helper packager for release recovery
        if: matrix.platform == 'macos' && needs.validate.outputs.recovery == 'true'
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.helper_sha256 }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/recovery-helper/build_tunnel_bundle.py"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$tool" | shasum -a 256 -c -
          cp "$tool" scripts/build_tunnel_bundle.py
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Add native LLVM to PATH
        if: matrix.platform == 'windows' && matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'clang.exe') -PathType Leaf)) {
            throw "Native LLVM is unavailable at $llvmBin"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build only native standalone helpers with inbox ConPTY
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          test "$host" = '${{ matrix.target }}'
          packages=(-p festerm-sessiond -p festerm-tunnel-bridge)
          if [[ "$HEADLESS_HELPERS" == true ]]; then
            packages+=(-p festerm-host)
          else
            test "$RELEASE_RECOVERY" = true
          fi
          cargo build --locked --release "${packages[@]}" --bins
          cargo metadata --locked --format-version 1 --filter-platform "$host" > helper-metadata.json
      - name: Stage native Windows signing input and dependency notices
        if: matrix.platform == 'windows'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import build_tunnel_bundle as bundle
          root = Path.cwd()
          bundle.validate_version(os.environ["VERSION"], root)
          notices = bundle.third_party_notices(
              json.loads(Path("helper-metadata.json").read_text(encoding="utf-8")),
              os.environ["VERSION"], root,
          )
          destination = Path("helper-input")
          destination.mkdir()
          for name in bundle.binary_names("windows"):
              source = Path("target/release") / name
              if source.is_symlink() or not source.is_file() or source.stat().st_size == 0:
                  raise ValueError(f"Missing regular helper executable: {name}")
              shutil.copyfile(source, destination / name)
          (destination / "THIRD_PARTY_NOTICES.txt").write_bytes(notices)
          (destination / "VERSION").write_text(os.environ["VERSION"] + "\n", encoding="ascii", newline="\n")
          PY
      - name: Sign and verify all macOS helper executables
        if: matrix.platform == 'macos'
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          umask 077
          mkdir helper-signing helper-notarize
          python - <<'PY'
          import base64, os
          from pathlib import Path
          Path("helper-signing/certificate.p12").write_bytes(
              base64.b64decode("".join(os.environ["APPLE_CERTIFICATE"].split()), validate=True)
          )
          Path("helper-signing/AuthKey.p8").write_text(
              os.environ["APPLE_API_KEY_P8"], encoding="utf-8"
          )
          PY
          keychain="$GITHUB_WORKSPACE/helper-signing/release.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # Fresh runners need the keychain in the user search list before
          # set-key-partition-list can find the imported private key.
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          security list-keychains -d user -s "$keychain" $existing
          security import helper-signing/certificate.p12 -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          binaries=(festerm-sessiond festerm-tunnel-bridge festerm-tunnel-setup)
          if [[ "$HEADLESS_HELPERS" == true ]]; then binaries+=(festerm-host); fi
          for binary in "${binaries[@]}"; do
            codesign --force --options runtime --timestamp \
              --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" \
              --identifier "dev.fes.$binary" "target/release/$binary"
            codesign --verify --strict --verbose=2 "target/release/$binary"
            cp "target/release/$binary" "helper-notarize/$binary"
          done
          # notarytool accepts ZIP, not tar.gz. Native CLI tickets cannot be
          # stapled; submit the exact signed bytes before distributing them.
          ditto -c -k helper-notarize helper-notarization.zip
          xcrun notarytool submit helper-notarization.zip \
            --key "$GITHUB_WORKSPACE/helper-signing/AuthKey.p8" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json > helper-notarization.json
          python -c 'import json; assert json.load(open("helper-notarization.json"))["status"] == "Accepted"'
      - name: Remove macOS signing credentials
        if: always() && matrix.platform == 'macos'
        run: |
          set -euo pipefail
          keychain="$GITHUB_WORKSPACE/helper-signing/release.keychain-db"
          if test -f "$keychain"; then
            security delete-keychain "$keychain"
          fi
          rm -rf helper-signing helper-notarize helper-notarization.zip
      - name: Package deterministic Unix helper bundle
        if: matrix.platform != 'windows'
        run: |
          set -euo pipefail
          options=()
          # Only macOS recovery replaces its tagged producer with this reviewed
          # tooling. Other platforms keep the producer from the exact tag.
          if [[ "$HEADLESS_HELPERS" != true && "$HELPER_PLATFORM" == macos ]]; then
            test "$RELEASE_RECOVERY" = true
            options+=(--legacy-helpers)
          fi
          python scripts/build_tunnel_bundle.py \
            --version "$VERSION" --platform "$HELPER_PLATFORM" --arch "$HELPER_ARCH" \
            --metadata helper-metadata.json "${options[@]}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: matrix.platform != 'windows'
        with:
          name: release-tunnel-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: matrix.platform == 'windows'
        with:
          name: helper-signing-input-windows-${{ matrix.arch }}
          path: helper-input/*
          if-no-files-found: error
          retention-days: 1

  helper-windows-sign:
    name: Sign standalone Windows helpers (${{ matrix.arch }})
    needs: [validate, helper-bundles]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    # Azure's signing client runs on x64; ARM64 binaries were built natively.
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      HEADLESS_HELPERS: ${{ needs.validate.outputs.headless_helpers }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: helper-signing-input-windows-${{ matrix.arch }}
          path: helper-input
      - name: Require protected signing configuration and exact native build input
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          foreach ($name in @(
            'AZURE_ARTIFACT_SIGNING_ACCOUNT', 'AZURE_ARTIFACT_SIGNING_ENDPOINT',
            'AZURE_ARTIFACT_SIGNING_PROFILE', 'AZURE_CLIENT_ID',
            'AZURE_SUBSCRIPTION_ID', 'AZURE_TENANT_ID'
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Missing protected release value: $name"
            }
          }
          $expected = @(
            'festerm-sessiond.exe', 'festerm-tunnel-bridge.exe',
            'festerm-tunnel-setup.exe', 'festerm-tunnel-worker.exe', 'THIRD_PARTY_NOTICES.txt', 'VERSION'
          )
          if ($env:HEADLESS_HELPERS -eq 'true') { $expected += 'festerm-host.exe' }
          $actual = @(Get-ChildItem helper-input -Force)
          if ($actual.Count -ne $expected.Count -or
              @(Compare-Object ($expected | Sort-Object) ($actual.Name | Sort-Object)).Count -ne 0) {
            throw 'Unexpected helper signing input'
          }
          foreach ($file in $actual) {
            if ($file.PSIsContainer -or $file.Length -eq 0 -or
                ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw 'Expected nonempty regular signing input files'
            }
          }
          if ([IO.File]::ReadAllText((Resolve-Path helper-input/VERSION)) -cne "$env:VERSION`n") {
            throw 'Native build VERSION mismatch'
          }
          $expectedMachine = if ('${{ matrix.arch }}' -eq 'aarch64') { 0xAA64 } else { 0x8664 }
          foreach ($name in $expected | Where-Object { $_.EndsWith('.exe') }) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path "helper-input/$name"))
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne $expectedMachine) {
              throw "Unexpected PE architecture: $name"
            }
          }
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign all standalone helper executables
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\helper-input\festerm-sessiond.exe
            ${{ github.workspace }}\helper-input\festerm-tunnel-bridge.exe
            ${{ github.workspace }}\helper-input\festerm-tunnel-setup.exe
            ${{ github.workspace }}\helper-input\festerm-tunnel-worker.exe
            ${{ needs.validate.outputs.headless_helpers == 'true' && format('{0}\helper-input\festerm-host.exe', github.workspace) || '' }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Authenticode and package signed helpers
        shell: pwsh
        run: |
          $names = @('festerm-sessiond', 'festerm-tunnel-bridge', 'festerm-tunnel-setup', 'festerm-tunnel-worker')
          if ($env:HEADLESS_HELPERS -eq 'true') { $names += 'festerm-host' }
          foreach ($name in $names) {
            if ((Get-AuthenticodeSignature "helper-input/$name.exe").Status -ne 'Valid') {
              throw "Helper is not Authenticode-valid: $name"
            }
          }
          python scripts/build_tunnel_bundle.py --version $env:VERSION `
            --platform windows --arch '${{ matrix.arch }}' `
            --binary-dir helper-input --notices helper-input/THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Helper packaging failed' }
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-tunnel-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, macos, windows, linux, helper-bundles, helper-windows-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: optional-font-downloads
          path: font-downloads
      - name: Verify optional font assets against this release's catalog
        run: python3 scripts/manage_bundled_font.py --stage-downloads font-downloads
      - name: Stage standalone helper installers
        run: |
          set -euo pipefail
          cp scripts/install-dev-tunnel.sh scripts/install-dev-tunnel.ps1 dist/
      - name: Verify release payload
        run: |
          set -euo pipefail
          expected=(
            "fesTerm-${VERSION}-macos-aarch64.dmg"
            "fesTerm-${VERSION}-macos-aarch64.app.tar.gz"
            "fesTerm-${VERSION}-macos-aarch64.app.tar.gz.sig"
            "fesTerm-${VERSION}-windows-x86_64-setup.exe"
            "fesTerm-${VERSION}-windows-x86_64-setup.exe.sig"
            "fesTerm-${VERSION}-windows-aarch64-setup.exe"
            "fesTerm-${VERSION}-windows-aarch64-setup.exe.sig"
            "fesTerm-${VERSION}-linux-x86_64.AppImage"
            "fesTerm-${VERSION}-linux-x86_64.AppImage.sig"
            "fesTerm-${VERSION}-linux-x86_64.deb"
            "fesTerm-${VERSION}-linux-aarch64.AppImage"
            "fesTerm-${VERSION}-linux-aarch64.AppImage.sig"
            "fesTerm-${VERSION}-linux-aarch64.deb"
            "install-dev-tunnel.sh"
            "install-dev-tunnel.ps1"
          )
          for platform in linux macos windows; do
            extension=tar.gz
            if [[ "$platform" == windows ]]; then extension=zip; fi
            for arch in x86_64 aarch64; do
              archive="fesTerm-tunnel-${VERSION}-${platform}-${arch}.${extension}"
              expected+=("$archive" "$archive.sha256")
              python3 -c \
                'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from build_tunnel_bundle import verify_bundle; verify_bundle(Path(sys.argv[1]), sys.argv[2], sys.argv[3])' \
                "dist/$archive" "$VERSION" "$platform"
              (cd dist && sha256sum --strict --check "$archive.sha256")
            done
          done
          for artifact in "${expected[@]}"; do
            test -s "dist/$artifact"
          done
          # 13 desktop assets, 12 helper archives/checksums, 2 installers.
          test "${#expected[@]}" -eq 27
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq "${#expected[@]}"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: needs.validate.outputs.authenticated_helpers == 'true'
      - name: Install pinned cargo-packager for helper metadata signatures
        if: needs.validate.outputs.authenticated_helpers == 'true'
        run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
      - name: Prepare standalone helper metadata and verifier without signing secrets
        if: needs.validate.outputs.authenticated_helpers == 'true'
        env:
          FESTERM_UPDATE_PUBLIC_KEY: ${{ vars.FESTERM_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$FESTERM_UPDATE_PUBLIC_KEY"
          test "$FESTERM_UPDATE_PUBLIC_KEY" = "$(cat packaging/updater.pub)"
          cargo build --locked --release -p festerm-host-setup --features artifacts --bin festerm-verify-artifact
          for platform in linux macos windows; do
            extension=tar.gz
            if [[ "$platform" == windows ]]; then extension=zip; fi
            for arch in x86_64 aarch64; do
              archive="dist/fesTerm-tunnel-${VERSION}-${platform}-${arch}.${extension}"
              python3 scripts/build_host_manifest.py \
                --version "$VERSION" --platform "$platform" --arch "$arch" "$archive"
            done
          done
      - name: Sign standalone helper release metadata
        if: needs.validate.outputs.authenticated_helpers == 'true'
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"
          test -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD"
          for platform in linux macos windows; do
            extension=tar.gz
            if [[ "$platform" == windows ]]; then extension=zip; fi
            for arch in x86_64 aarch64; do
              archive="dist/fesTerm-tunnel-${VERSION}-${platform}-${arch}.${extension}"
              cargo packager signer sign "$archive.manifest.json"
            done
          done
      - name: Authenticate standalone helper release metadata
        if: needs.validate.outputs.authenticated_helpers == 'true'
        run: |
          set -euo pipefail
          for platform in linux macos windows; do
            extension=tar.gz
            if [[ "$platform" == windows ]]; then extension=zip; fi
            for arch in x86_64 aarch64; do
              archive="dist/fesTerm-tunnel-${VERSION}-${platform}-${arch}.${extension}"
              test -s "$archive.manifest.json.sig"
              target/release/festerm-verify-artifact "$VERSION" "$platform" "$arch" "$archive"
            done
          done
          # Existing 27 payloads plus six signed manifests and six signatures.
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 39
      - name: Generate release notes and signed update manifest
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$SOURCE_COMMIT" \
            --jq .body > release-notes.md
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          python3 scripts/generate_update_manifest.py \
            --version "$VERSION" \
            --notes-file release-notes.md \
            --artifact "macos-aarch64=dist/fesTerm-${VERSION}-macos-aarch64.app.tar.gz=$base/fesTerm-${VERSION}-macos-aarch64.app.tar.gz=app" \
            --artifact "windows-x86_64=dist/fesTerm-${VERSION}-windows-x86_64-setup.exe=$base/fesTerm-${VERSION}-windows-x86_64-setup.exe=nsis" \
            --artifact "windows-aarch64=dist/fesTerm-${VERSION}-windows-aarch64-setup.exe=$base/fesTerm-${VERSION}-windows-aarch64-setup.exe=nsis" \
            --artifact "linux-x86_64=dist/fesTerm-${VERSION}-linux-x86_64.AppImage=$base/fesTerm-${VERSION}-linux-x86_64.AppImage=appimage" \
            --artifact "linux-aarch64=dist/fesTerm-${VERSION}-linux-aarch64.AppImage=$base/fesTerm-${VERSION}-linux-aarch64.AppImage=appimage" \
            --output festerm-update.json
      - name: Publish immutable artifacts, then update metadata
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --draft \
            --title "fesTerm $TAG" \
            --notes-file release-notes.md
          gh release upload "$TAG" dist/*
          gh release upload "$TAG" font-downloads/*
          gh release upload "$TAG" festerm-update.json
          gh release edit "$TAG" --draft=false --latest
