output_path = "tests/snapshots"
threshold = 0.6
max_failed_pixels = 0

[windows]
threshold = 0.6
max_failed_pixels = 0

[linux]
# GitHub Actions' ubuntu-latest runners have no GPU, so CI renders headless
# snapshots with Mesa's Lavapipe software Vulkan rasterizer. Lavapipe
# antialiases text glyph edges slightly differently than the renderer used to
# capture the reviewed reference PNGs, producing small, deterministic
# glyph-edge pixel diffs (up to ~1716 pixels observed) even though the
# rendered content is otherwise pixel-for-pixel identical. Verified by manual
# review of the CI diff images: every differing pixel sits exactly on a text
# glyph's antialiased edge, never on layout, color fills, or structural
# content. Allow enough headroom to absorb that rasterizer noise while still
# failing on any real regression (which would affect far more pixels).
threshold = 0.6
max_failed_pixels = 2000

[mac]
threshold = 0.6
max_failed_pixels = 0
